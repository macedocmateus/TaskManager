openapi: 3.0.0
info:
  title: TaskManager API
  description: API de gerenciamento de tarefas
  version: 1.0.0
servers:
  - url: http://localhost:3333
    description: Development
tags:
  - name: Users
  - name: Sessions
  - name: Teams
  - name: Tasks
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /users:
    post:
      tags:
        - Users
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: johndoe
                email:
                  type: string
                  example: johndoe@email.com
                password:
                  type: string
                  example: 123456
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Auto-generated UUID
                  name:
                    type: string
                    example: johndoe
                  email:
                    type: string
                    example: johndoe@email.com
                  role:
                    type: string
                    enum:
                      - admin
                      - member
                    default: member
                    example: member
                    description: Default is member
                  createdAt:
                    type: string
                    format: date-time
                    description: Auto-generated
                  updatedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: Auto-updated on changes
        '400':
          description: Email already exists or validation error
        '500':
          description: Internal server error

  /sessions:
    post:
      tags:
        - Sessions
      summary: Authenticate an user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: johndoe@email.com
                password:
                  type: string
                  example: 123456
      responses:
        '200':
          description: Authenticate successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Bearer JWT token
                    example: easdjgbSpsKs...
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                        example: johndoe
                      email:
                        type: string
                        example: johndoe@email.com
                      role:
                        type: string
                        enum:
                          - member
                          - admin
                        example: member
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                        nullable: true
        '400':
          description: Can't be authenticate
        '500':
          description: Internal server error

  /teams:
    post:
      tags:
        - Teams
      summary: Create a new team
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Sevens
                description:
                  type: string
                  example: Os 7 devs
      responses:
        '201':
          description: Team created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Auto-generated UUID
                  name:
                    type: string
                    example: Sevens
                  description:
                    type: string
                    example: Os 7 devs
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                    nullable: true
        '400':
          description: Team can't be created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
    get:
      tags:
        - Teams
      summary: List teams
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Team listed successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Auto-generated UUID
                    name:
                      type: string
                      example: Sevens
                    description:
                      type: string
                      nullable: true
                      example: Os 7 devs
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                      nullable: true
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error

  /teams/{id}:
    put:
      tags:
        - Teams
      summary: Update a team
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Team ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: The nines
                description:
                  type: string
      responses:
        '200':
          description: Team updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Auto-generated UUID
                  name:
                    type: string
                    example: The nines
                  description:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                    nullable: true
        '400':
          description: Team can't be updated
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
    delete:
      tags:
        - Teams
      summary: Delete a team
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Team ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Team deleted successfully
        '400':
          description: Team not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error

  /teams/{id}/members:
    post:
      tags:
        - Teams
      summary: Add member in a team
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Team ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Member added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Auto-generated UUID
                  teamId:
                    type: string
                    format: uuid
                    description: Team ID
                  userId:
                    type: string
                    format: uuid
                    description: User ID
                  createdAt:
                    type: string
                    format: date-time
        '400':
          description: Member can't be added in a team
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
    get:
      tags:
        - Teams
      summary: List members in a team
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Team ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Members listed in a team successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Auto-generated UUID
                    teamId:
                      type: string
                      format: uuid
                    userId:
                      type: string
                      format: uuid
                    createdAt:
                      type: string
                      format: date-time
                    user:
                      type: object
                      properties:
                        name:
                          type: string
                          example: johndoe
                    team:
                      type: object
                      properties:
                        name:
                          type: string
                          example: Sevens
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error

  /teams/{id}/members/{userId}:
    delete:
      tags:
        - Teams
      summary: Delete a member in a team
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Team ID
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          description: Member ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Member removed successfully
        '400':
          description: Member not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error

  /tasks:
    post:
      tags:
        - Tasks
      summary: Create a task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: Fix login bug
                description:
                  type: string
                  nullable: true
                assignedTo:
                  type: string
                  format: uuid
                teamId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  title:
                    type: string
                    example: Fix login bug
                  description:
                    type: string
                    nullable: true
                  status:
                    type: string
                    enum:
                      - pending
                      - in_progress
                      - completed
                    default: pending
                    example: pending
                  priority:
                    type: string
                    enum:
                      - high
                      - medium
                      - low
                    default: low
                    example: low
                  assignedTo:
                    type: string
                    format: uuid
                  teamId:
                    type: string
                    format: uuid
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                    nullable: true
        '400':
          description: Task can't be created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
    get:
      tags:
        - Tasks
      summary: List tasks
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - in_progress
              - completed
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum:
              - high
              - medium
              - low
      responses:
        '200':
          description: Tasks listed successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    title:
                      type: string
                      example: Fix login bug
                    description:
                      type: string
                      nullable: true
                    status:
                      type: string
                      enum:
                        - pending
                        - in_progress
                        - completed
                      example: pending
                    priority:
                      type: string
                      enum:
                        - high
                        - medium
                        - low
                      example: low
                    assignedTo:
                      type: string
                      format: uuid
                    teamId:
                      type: string
                      format: uuid
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                      nullable: true
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error

  /tasks/{id}:
    put:
      tags:
        - Tasks
      summary: Update a task
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: Fix login bug
                description:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum:
                    - pending
                    - in_progress
                    - completed
                priority:
                  type: string
                  enum:
                    - high
                    - medium
                    - low
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  title:
                    type: string
                    example: Fix login bug
                  description:
                    type: string
                    nullable: true
                  status:
                    type: string
                    enum:
                      - pending
                      - in_progress
                      - completed
                    example: pending
                  priority:
                    type: string
                    enum:
                      - high
                      - medium
                      - low
                    example: low
                  assignedTo:
                    type: string
                    format: uuid
                  teamId:
                    type: string
                    format: uuid
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                    nullable: true
        '400':
          description: Tasks can't be edited
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
    delete:
      tags:
        - Tasks
      summary: Delete a task
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task deleted successfully
        '400':
          description: Task can't be deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error

  /tasks/{id}/history:
    get:
      tags:
        - Tasks
      summary: List task history
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task history listed successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    taskId:
                      type: string
                      format: uuid
                    changedBy:
                      type: string
                      format: uuid
                    oldStatus:
                      type: string
                      enum:
                        - pending
                        - in_progress
                        - completed
                    newStatus:
                      type: string
                      enum:
                        - pending
                        - in_progress
                        - completed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
