openapi: 3.0.0
info:
  title: TaskManager API
  description: API de gerenciamento de tarefas
  version: 1.0.0
servers:
  - url: http://localhost:3333
    description: Development
tags:
  - name: Users
  - name: Sessions
  - name: Teams
  - name: Tasks
  
paths:
  /users:
    post:
      tags:
        - Users
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: johndoe
                email:
                  type: string
                  example: johndoe@email.com
                password:
                  type: string
                  example: 123456
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Auto-generated UUID
                  name:
                    type: string
                    example: johndoe
                  email:
                    type: string
                    example: johndoe@email.com
                  role:
                    type: string
                    enum:
                      - admin
                      - member
                    default: member
                    example: member
                    description: Default is member
                  createdAt:
                    type: string
                    format: date-time
                    description: Auto-generated
                  updatedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: Auto-updated on changes
        '400':
          description: Email already exists or validation error
        '500':
          description: Internal server error

  /sessions:
    post:
      tags:
        - Sessions
      summary: Authenticate an user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: johndoe@email.com
                password:
                  type: string
                  example: 123456
      responses:
        '200':
          description: Authenticate successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Bearer JWT token
                    example: easdjgbSpsKs...
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                        example: johndoe
                      email:
                        type: string
                        example: johndoe@email.com
                      role:
                        type: string
                        enum:
                          - member
                          - admin
                        example: member
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                        nullable: true
        '400':
          description: Can't be authenticate
        '500':
          description: Internal server error
