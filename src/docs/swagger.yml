openapi: 3.0.0
info:
  title: TaskManager API
  description: API de gerenciamento de tarefas
  version: 1.0.0
servers:
  - url: http://localhost:3333
    description: Development
tags:
  - name: Users
  - name: Sessions
  - name: Teams
  - name: Tasks
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
paths:
  /users:
    post:
      tags:
        - Users
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: johndoe
                email:
                  type: string
                  example: johndoe@email.com
                password:
                  type: string
                  example: 123456
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Auto-generated UUID
                  name:
                    type: string
                    example: johndoe
                  email:
                    type: string
                    example: johndoe@email.com
                  role:
                    type: string
                    enum:
                      - admin
                      - member
                    default: member
                    example: member
                    description: Default is member
                  createdAt:
                    type: string
                    format: date-time
                    description: Auto-generated
                  updatedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: Auto-updated on changes
        '400':
          description: Email already exists or validation error
        '500':
          description: Internal server error

  /sessions:
    post:
      tags:
        - Sessions
      summary: Authenticate an user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: johndoe@email.com
                password:
                  type: string
                  example: 123456
      responses:
        '200':
          description: Authenticate successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Bearer JWT token
                    example: easdjgbSpsKs...
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                        example: johndoe
                      email:
                        type: string
                        example: johndoe@email.com
                      role:
                        type: string
                        enum:
                          - member
                          - admin
                        example: member
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                        nullable: true
        '400':
          description: Can't be authenticate
        '500':
          description: Internal server error
  /teams:
    post:
      tags:
        - Teams
      summary: Create a new team
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Sevens
                description:
                  type: string
                  example: Os 7 devs
      responses:
        '201':
          description: Team created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Auto-generated UUID
                  name:
                    type: string
                    example: Sevens
                  description:
                    type: string
                    example: Os 7 devs
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                    nullable: true
        '400':
          description: Team can't be created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
    get:
      tags: 
        - Teams
      summary: List teams
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Team listed successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Auto-generated UUID
                    name:
                      type: string
                      example: Sevens
                    description:
                      type: string
                      nullable: true
                      example: Os 7 devs
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                      nullable: true
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  
    /teams/{id}:
      put:
        tags: 
          - Teams
        summary: Update a team
        security:
          - bearerAuth: []
        parameters:
          - name: id
            in: path
            required: true
            description: Team ID
            schema:
              type: string
              format: uuid
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: The nines
                  description:
                    type: string
                    example:
        responses:
          '200':
            description: Team updated successfully
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Auto-generated UUID
                    name:
                      type: string
                      example: The nines
                    description:
                      type: string
                      example:
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                      nullable: true
          '400':
            description: Team can't be updated
          '401':
            description: Unauthorized
          '403':
            description: Forbidden
          '500':
            description: Internal server error
      delete:
        tags: 
          - Teams
        summary: Delete a team
        security:
          - bearerAuth: []
        parameters:
          - name: id
            in: path
            required: true
            description: Team ID
            schema:
              type: string
              format: uuid
        responses:
          '200':
            description: Team deleted successfully
          '400':
            description: Team not found
          '401':
            description: Unauthorized
          '403':
            description: Forbidden
          '500':
            description: Internal server error
